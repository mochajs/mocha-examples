name: Tests
on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
  workflow_dispatch:

env:
  # The puppeteer examples launch regular headless Chrome, never
  # `headless: 'shell'`, so chrome-headless-shell is unused. Its download
  # also fails cache validation on Windows runners (the extracted .exe
  # disappears between installs), so skip it entirely.
  PUPPETEER_CHROME_HEADLESS_SHELL_SKIP_DOWNLOAD: 'true'

jobs:
  test:
    name: 'Node.js v${{ matrix.node }}'
    # ubuntu-latest has issues running puppeteer
    # https://github.com/mochajs/mocha-examples/issues/120
    runs-on: windows-latest
    strategy:
      matrix:
        node:
          - 20
          - 22
          - 24
          - 26
    steps:
      - uses: actions/setup-node@v4.3.0
        with:
          node-version: '${{ matrix.node }}'
      - uses: actions/checkout@v4.2.2
      - name: 'Cache node_modules'
        uses: actions/cache@v4.2.3
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-v${{ matrix.node }}-${{ hashFiles('**/package.json') }}
          restore-keys: |
            ${{ runner.os }}-node-v${{ matrix.node }}-
      - name: Exclude browser caches from Windows Defender
        # Defender's real-time scanning can quarantine freshly extracted
        # Chrome for Testing binaries, leaving the puppeteer cache with a
        # browser folder whose executable is missing.
        run: Add-MpPreference -ExclusionPath "$env:USERPROFILE\.cache", "$env:LOCALAPPDATA\ms-playwright"
      - name: Install Dependencies
        run: npm install
      - name: Run All Node.js Tests
        run: npm run test
