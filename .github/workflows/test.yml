name: Tests
on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
  workflow_dispatch:

jobs:
  test:
    name: 'Node.js v${{ matrix.node }}'
    # ubuntu-latest has issues running puppeteer
    # https://github.com/mochajs/mocha-examples/issues/120
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        node:
          - 20
          - 22
          - 24
          - 26
    steps:
      - uses: actions/setup-node@v4.3.0
        with:
          node-version: '${{ matrix.node }}'
      - uses: actions/checkout@v4.2.2
      - name: 'Cache node_modules'
        uses: actions/cache@v4.2.3
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-v${{ matrix.node }}-${{ hashFiles('**/package.json') }}
          restore-keys: |
            ${{ runner.os }}-node-v${{ matrix.node }}-
      - name: Install Dependencies
        run: npm install
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
      - name: Install Chrome for the puppeteer examples
        working-directory: packages/puppeteer
        run: |
          node -p "const p = require('puppeteer'); process.version + ' ' + JSON.stringify((p.default || p).configuration)"
          node node_modules/puppeteer/lib/cjs/puppeteer/node/cli.js browsers install chrome
          node -e "const fs=require('fs'); const p=require('puppeteer').executablePath(); console.log('resolved:', p, 'exists:', fs.existsSync(p)); if (!fs.existsSync(p)) process.exit(1)"
      - name: Run All Node.js Tests
        run: npm run test
